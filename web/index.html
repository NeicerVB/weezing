<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weezing — simulación SEIR</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1>Simulación SEIR</h1>
    <p class="hint">Autómata sobre un grafo sintético. Un paso por día, cambios simultáneos.</p>
  </header>

  <form id="form">
    <label>Población <input type="number" id="n" value="500" min="1" max="2000" step="1"></label>
    <label>Días <input type="number" id="days" value="30" min="0" max="365" step="1"></label>
    <label>Semilla <input type="number" id="seed" value="42" step="1"></label>
    <label>β <input type="number" id="beta" value="0.03" min="0" max="1" step="0.001"></label>
    <label>σ <input type="number" id="sigma" value="0.2" min="0" max="1" step="0.01"></label>
    <label>γ <input type="number" id="gamma" value="0.1" min="0" max="1" step="0.01"></label>
    <label>Grado promedio <input type="number" id="degree" value="6" min="0" step="0.5"></label>
    <label>E₀ <input type="number" id="e0" value="5" min="0" step="1"></label>
    <label>I₀ <input type="number" id="i0" value="3" min="0" step="1"></label>
    <label>R₀ <input type="number" id="r0" value="0" min="0" step="1"></label>
    <button type="submit" id="submit">Simular</button>
  </form>

  <p id="error" role="alert" hidden></p>

  <section id="results" hidden>
    <p id="summary" class="summary"></p>

    <figure>
      <figcaption>
        <span class="key s">S</span><span class="key e">E</span>
        <span class="key i">I</span><span class="key r">R</span>
      </figcaption>
      <svg id="curve" viewBox="0 0 720 300" role="img" aria-labelledby="curve-title"></svg>
    </figure>

    <figure class="network-figure">
      <figcaption>
        <span>Red de conexiones e infección</span>
        <span class="key s">S</span><span class="key e">E</span>
        <span class="key i">I</span><span class="key r">R</span>
      </figcaption>

      <div class="network-container">
        <canvas id="network-canvas" width="900" height="520"></canvas>
        <div id="network-tooltip" class="network-tooltip" hidden></div>
      </div>

      <div class="network-controls">
        <button type="button" id="net-play" class="btn-ctrl" title="Reproducir / Pausar">▶</button>
        <button type="button" id="net-reset" class="btn-ctrl" title="Reiniciar al día 0">⏮</button>
        <div class="timeline-group">
          <input type="range" id="net-slider" min="0" max="30" value="0" step="1">
          <span class="net-day-badge">Día <strong id="net-day-val">0</strong> / <span id="net-day-max">30</span></span>
        </div>
        <div class="speed-group">
          <label for="net-speed">Velocidad</label>
          <select id="net-speed">
            <option value="1000">0.5×</option>
            <option value="500" selected>1×</option>
            <option value="250">2×</option>
            <option value="100">5×</option>
          </select>
        </div>
      </div>
      <p id="net-scale-note" class="hint scale-note" hidden>
        Nota: Con poblaciones grandes (N &gt; 150) la física continua puede ralentizarse. Se recomienda N ≤ 100 para máxima fluidez.
      </p>
    </figure>

    <figure>
      <figcaption>Nuevos S → E por día</figcaption>
      <svg id="bars" viewBox="0 0 720 220" role="img" aria-labelledby="bars-title"></svg>
    </figure>

  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
