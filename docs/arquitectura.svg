SITANTE</text><text x="790" y="191" fill="#dfedf4" font-size="17">Web Worker · Monte Carlo local</text><text x="790" y="222" fill="#9cb4c2" font-size="14">3 políticas · misma red y semillas</text><text x="790" y="271" fill="#dfedf4" font-size="17">WebGL 3D + curvas + métricas</text><text x="790" y="301" fill="#9cb4c2" font-size="14">Reproducción día a día · parámetros</text><text x="790" y="351" fill="#9cb4c2" font-size="14">Resultados → descarga JSON local</text><g fill="none" stroke="#63d9bc" stroke-width="2" marker-end="url(#arrow)"><path d="M345 210H415"/><path d="M555 251V291"/><path d="M720 330H765"/></g><rect x="395" y="455" width="325" height="105" rx="12" fill="#24372d" stroke="#57745d"/><text x="415" y="489" fill="#d8eddd" font-size="18">AWS Budget · USD 5/mes</text><text x="415" y="518" fill="#a4c2b0" font-size="13">Alertas al correo del equipo</text><text x="415" y="541" fill="#a4c2b0" font-size="12">Verificación del destinatario pendiente</text><text x="40" y="601" fill="#8faab9" font-size="13">Público: aplicación, código compilado y datos agregados. Privado: bucket, acceso de despliegue y resultados del usuario.</text></g></svg>
