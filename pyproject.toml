[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weezing-seir"
version = "0.1.0"
description = "Demostración didáctica de un modelo SEIR agregado"
requires-python = ">=3.10"

[project.scripts]
weezing-seir = "seir.cli:main"

[tool.setuptools.packages.find]
include = ["seir*"]
